<div class="categories-page">
  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>Categories</h1>
      <p class="subtitle">Organize your products by category</p>
    </div>
    <button class="btn-primary" disabled title="Coming next">
      + Add Category
    </button>
  </div>

  <!-- Search -->
  <div class="toolbar">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Search categories..."
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
      />
    </div>
  </div>

  <!-- States -->
  <div *ngIf="loading" class="state">Loading categories...</div>
  <div *ngIf="error" class="state error">{{ error }}</div>

  <!-- Table -->
  <div class="table-card" *ngIf="!loading && !error">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of filteredCategories">
          <td class="name">{{ category.name }}</td>
          <td class="desc">{{ category.description || '—' }}</td>
          <td>
            <span class="status" [class.active]="category.isActive" [class.inactive]="!category.isActive">
              {{ category.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </tr>

        <tr *ngIf="filteredCategories.length === 0">
          <td colspan="3" class="empty">No categories found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
