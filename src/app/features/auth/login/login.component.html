<div class="login-page">
  <div class="brand">
    <div class="mark" aria-hidden="true">HP</div>
    <div>
      <h1>Hardware PRO</h1>
      <p>Construction &amp; hardware POS</p>
    </div>
  </div>

  <div class="pill" [class.shake]="shake" [class.wide]="step === 'password'">
    <button
      type="button"
      class="icon"
      (click)="onBack()"
      [attr.aria-label]="step === 'password' ? 'Back to email' : 'Account'"
    >
      @if (step === 'email') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5h18c.6 0 1 .4 1 1v.4l-10 6.6L2 6.4V6c0-.6.4-1 1-1zM2 8.5l10 6.5 10-6.5V18c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a4.5 4.5 0 0 0-4.5 4.5V10H6c-.6 0-1 .4-1 1v9c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-9c0-.6-.4-1-1-1h-1.5V6.5A4.5 4.5 0 0 0 12 2zm0 2a2.5 2.5 0 0 1 2.5 2.5V10h-5V6.5A2.5 2.5 0 0 1 12 4z"/>
        </svg>
      }
    </button>

    <label class="field">
      <span class="lbl">{{ label }}</span>
      @if (step === 'email') {
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="username"
          (keydown.enter)="onEnter($event)"
          [disabled]="loading"
        />
      } @else {
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          (keydown.enter)="onEnter($event)"
          [disabled]="loading"
        />
      }
    </label>

    <button
      type="button"
      class="go"
      (click)="onNext()"
      [disabled]="loading"
      [attr.aria-label]="step === 'email' ? 'Next' : 'Sign in'"
    >
      @if (loading) {
        <span class="spinner"></span>
      } @else {
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      }
    </button>
  </div>

  @if (error) {
    <p class="error" role="alert">{{ error }}</p>
  }

  <p class="hint">
    @if (step === 'email') {
      Enter your work email, then continue.
    } @else {
      <button type="button" class="link" (click)="onBack()" [disabled]="loading">Change email</button>
    }
  </p>
</div>
